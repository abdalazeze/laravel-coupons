name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check style
        run: vendor/bin/pint --test
      # Apps install without dev autoload rules; Coupon::factory() must still resolve there.
      - name: Check production autoload
        run: |
          composer dump-autoload --no-dev
          php -r 'require "vendor/autoload.php"; exit(class_exists(Abdalazeze\Coupons\Database\Factories\CouponFactory::class) ? 0 : 1);'

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/pest --colors=always

  tests-mysql:
    name: MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      # The concurrency suite holds 150 connections open at once; the default limit is 151.
      - name: Raise connection limit
        run: mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL max_connections = 500;"
      - name: Run tests
        run: vendor/bin/pest --colors=always

  tests-pgsql:
    name: PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      # The concurrency suite holds 150 connections open at once; the default limit is 100
      # and only takes effect after a restart. Service containers accept no command args.
      - name: Raise connection limit
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "ALTER SYSTEM SET max_connections = 300;"
          docker restart ${{ job.services.postgres.id }}
          until pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
      - name: Run tests
        run: vendor/bin/pest --colors=always
